<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Open Graph / link-preview card. 1200x630 (~1.91:1) - the canonical
       OG ratio, so it renders uncropped on Facebook / LinkedIn / Slack /
       X (summary_large_image). Recomposed from social-header-1500x500.svg
       with the lockup centered for this ratio. -->

  <!-- background -->
  <rect width="1200" height="630" fill="#181b20"/>

  <!-- subtle horizontal "thread" lines for loom-texture flavor -->
  <g stroke="#2a2e36" stroke-width="1" opacity="0.45">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="230" x2="1200" y2="230"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="370" x2="1200" y2="370"/>
    <line x1="0" y1="440" x2="1200" y2="440"/>
    <line x1="0" y1="510" x2="1200" y2="510"/>
  </g>

  <!-- wordmark, centered -->
  <text x="600" y="305" font-family="Segoe UI Black, Arial Black, sans-serif" font-weight="900" font-size="130" fill="#ede8dd" text-anchor="middle" letter-spacing="-2">ORG LOOM</text>

  <!-- accent rule under wordmark -->
  <rect x="520" y="338" width="160" height="5" fill="#e09240"/>

  <!-- tagline -->
  <text x="600" y="408" font-family="Segoe UI, Arial, sans-serif" font-weight="400" font-size="38" fill="#cfccc3" text-anchor="middle">A canvas for Salesforce data.</text>
</svg>
